[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "Google-Drive-Files"
version = "0.1.3"
description = "Adds Google Drive file access from within OctoPrint's file manager."
authors = [
    { name = "jneilliii", email = "jneilliii+github@gmail.com" },
]
requires-python = ">=3.7,<4"
dependencies = [
    "cryptography>=38.0.0,<40",
    "httplib2<0.30.0",
    "pydrive2",
    "treelib",
]
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
googledrivefiles = "octoprint_googledrivefiles"

[project.urls]
Homepage = "https://github.com/jneilliii/OctoPrint-GoogleDriveFiles"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_googledrivefiles",
    "octoprint_googledrivefiles.*",
]
